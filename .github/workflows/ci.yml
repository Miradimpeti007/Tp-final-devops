name: CI

on:
  push:
    branches: [main, develop, "feature/*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  lint:
    name: Lint et formatage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check

  security:
    name: Sécurité dépendances
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Audit npm
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Dépendances obsolètes
        run: npm outdated || true

  test:
    name: Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shoplite_test
          POSTGRES_USER: shoplite
          POSTGRES_PASSWORD: shoplite_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Lancer les tests
        run: npm run test:coverage
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://shoplite:shoplite_password@localhost:5432/shoplite_test
      - name: Publier les résultats de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: api/coverage
          if-no-files-found: ignore

  build:
    name: Build et scan Docker
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build image API
        run: docker build -t shoplite-api:${{ github.sha }} ./api
      - name: Build image frontend
        run: docker build -t shoplite-frontend:${{ github.sha }} ./frontend
      - name: Vérifier la taille de l'image API
        run: docker images shoplite-api:${{ github.sha }}
      - name: Scan Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: shoplite-api:${{ github.sha }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
